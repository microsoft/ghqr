- id: org-sec-001
  scope: organization
  title: Two-factor authentication not required
  category: security
  severity: high
  description: The organization does not require two-factor authentication (2FA) for all members. This means any member account without 2FA is an easy target for credential-based attacks.
  recommendation: Enable the 2FA requirement in organization security settings to ensure all members must use two-factor authentication.
  learnMore: https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization
  tags: [security, authentication]
  enabled: true

- id: org-sec-002
  scope: organization
  title: Web commit signoff not required
  category: security
  severity: medium
  description: The organization does not require commit signoff for commits made through the GitHub web interface. Signoff creates an auditable record of who approved each change.
  recommendation: Consider enabling web commit signoff to improve the audit trail for changes made directly through the GitHub UI.
  learnMore: https://docs.github.com/en/organizations/managing-organization-settings/managing-the-commit-signoff-policy-for-your-organization
  tags: [security, audit]
  enabled: true

- id: org-sec-003
  scope: organization
  title: Default repository permission set to admin
  category: access_control
  severity: high
  description: The organization's default repository permission is set to 'admin', which grants all members admin access to every repository by default. This violates the principle of least privilege.
  recommendation: Change the default repository permission to 'read' or 'write' to ensure members only have the minimum access required.
  learnMore: https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/setting-base-permissions-for-an-organization
  tags: [access_control, permissions]
  enabled: true

- id: org-sec-004
  scope: organization
  title: Members can create public repositories
  category: access_control
  severity: medium
  description: Organization members are allowed to create public repositories. This increases the risk of accidental public exposure of proprietary code.
  recommendation: Consider restricting public repository creation to organization owners or admins to prevent accidental data exposure.
  learnMore: https://docs.github.com/en/organizations/managing-organization-settings/restricting-repository-creation-in-your-organization
  tags: [access_control, visibility]
  enabled: true

- id: org-sec-005
  scope: organization
  title: No security manager team assigned
  category: access_control
  severity: medium
  description: No security manager team is assigned to this organization. Without designated security managers, security alerts and configurations may not be actively monitored.
  recommendation: Assign a security manager team to ensure that security alerts and configurations are reviewed by the right people.
  learnMore: https://docs.github.com/en/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization
  tags: [access_control, security]
  enabled: true

- id: org-sec-006
  scope: organization
  title: "EMU enabled: two-factor authentication is controlled by your identity provider"
  category: security
  severity: info
  description: This organization belongs to an Enterprise Managed Users (EMU) enterprise. GitHub's organization-level 2FA setting does not apply because all authentication, including multi-factor authentication, is managed by the external identity provider (e.g. Microsoft Entra ID).
  recommendation: Ensure MFA is enforced in your identity provider. For Microsoft Entra ID, configure a Conditional Access policy requiring MFA for all users.
  learnMore: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfa-getstarted
  tags: [security, authentication, emu]
  enabled: true

- id: org-def-001
  scope: organization
  title: Dependabot alerts not enabled by default for new repositories
  category: dependencies
  severity: high
  description: Dependabot alerts are not automatically enabled for new repositories created in this organization. New repositories will not receive vulnerability notifications until manually configured. ghqr checks the default code security configuration for public and for private/internal new repositories when it is readable, and the deprecated organization setting otherwise; the finding states which scope is not covered.
  recommendation: Enable 'Dependabot alerts' in a code security configuration (for example 'GitHub recommended') and set it as the default for new public, private and internal repositories in Organization → Settings → Advanced Security (formerly Code security) → Configurations.
  learnMore: https://docs.github.com/en/code-security/dependabot/dependabot-alerts/configuring-dependabot-alerts
  tags: [dependabot, security, defaults]
  enabled: true

- id: org-def-002
  scope: organization
  title: Dependabot security updates not enabled by default for new repositories
  category: dependencies
  severity: medium
  description: Dependabot security updates are not automatically enabled for new repositories. Without this, Dependabot will alert on vulnerabilities but will not automatically open pull requests to fix them. ghqr checks the default code security configuration for public and for private/internal new repositories when it is readable, and the deprecated organization setting otherwise.
  recommendation: Enable 'Dependabot security updates' in the code security configuration set as the default for new public, private and internal repositories (Organization → Settings → Advanced Security (formerly Code security) → Configurations).
  learnMore: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates
  tags: [dependabot, security, defaults]
  enabled: true

- id: org-def-003
  scope: organization
  title: Dependency graph not enabled by default for new repositories
  category: dependencies
  severity: medium
  description: The dependency graph is not automatically enabled for new repositories. The dependency graph is required for Dependabot alerts and dependency review to function. ghqr checks the default code security configuration for public and for private/internal new repositories when it is readable, and the deprecated organization setting otherwise.
  recommendation: Enable the dependency graph in the code security configuration set as the default for new public, private and internal repositories (Organization → Settings → Advanced Security (formerly Code security) → Configurations).
  learnMore: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-the-dependency-graph
  tags: [dependabot, security, defaults]
  enabled: true

- id: org-def-004
  scope: organization
  title: Secret scanning not enabled by default for new repositories
  category: security
  severity: high
  description: Secret scanning is not automatically enabled for new repositories, leaving newly created repositories without protection against accidentally committed secrets. ghqr checks the default code security configuration for public and for private/internal new repositories when it is readable, and the deprecated organization setting otherwise; the finding states which scope is not covered.
  recommendation: Enable 'Secret scanning' in a code security configuration (for example 'GitHub recommended') and set it as the default for new public, private and internal repositories in Organization → Settings → Advanced Security (formerly Code security) → Configurations, so every new repository is protected from the moment it is created.
  learnMore: https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning
  tags: [secret_scanning, security, defaults]
  enabled: true

- id: org-def-005
  scope: organization
  title: Secret scanning push protection not enabled by default for new repositories
  category: security
  severity: high
  description: Push protection for secret scanning is not automatically enabled for new repositories, meaning secrets can be committed before they are detected. ghqr checks the default code security configuration for public and for private/internal new repositories when it is readable, and the deprecated organization setting otherwise.
  recommendation: Enable 'Push protection' in the code security configuration set as the default for new public, private and internal repositories (Organization → Settings → Advanced Security (formerly Code security) → Configurations) to block commits containing secrets before they reach the repository.
  learnMore: https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection
  tags: [secret_scanning, security, defaults]
  enabled: true

- id: org-def-006
  scope: organization
  title: GitHub Advanced Security not enabled by default for new repositories
  category: security
  severity: medium
  description: GitHub Advanced Security (GHAS) is not automatically enabled for new repositories. GHAS, now offered as GitHub Code Security and GitHub Secret Protection, is required for code scanning, advanced secret scanning, and dependency review. When the default code security configuration is readable, ghqr requires both products to be enabled for public and for private/internal new repositories and states which product or scope is missing; otherwise it uses the deprecated organization setting.
  recommendation: Enable GitHub Code Security and GitHub Secret Protection in the code security configuration set as the default for new public, private and internal repositories (Organization → Settings → Advanced Security (formerly Code security) → Configurations). Requires the corresponding licenses.
  learnMore: https://docs.github.com/en/get-started/learning-about-github/about-github-advanced-security
  tags: [ghas, security, defaults]
  enabled: true

- id: org-def-007
  scope: organization
  title: Private vulnerability reporting not enabled by default for new repositories
  category: security
  severity: medium
  description: Private vulnerability reporting is not automatically enabled for new repositories. Without this, security researchers have no private channel to report vulnerabilities, increasing the risk of public disclosure before a fix is ready. The feature only applies to public repositories, so when the default code security configuration is readable ghqr checks the default for public new repositories; otherwise it uses the organization setting.
  recommendation: Enable 'Private vulnerability reporting' in the code security configuration set as the default for new public repositories (Organization → Settings → Advanced Security (formerly Code security) → Configurations) to allow security researchers to privately report vulnerabilities.
  learnMore: https://docs.github.com/en/code-security/security-advisories/working-with-repository-security-advisories/configuring-private-vulnerability-reporting-for-a-repository
  tags: [security, vulnerability_reporting, defaults]
  enabled: true
